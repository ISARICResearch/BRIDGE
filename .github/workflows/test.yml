name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and unit test dependencies
        run: |
          python3 -m pip install uv
          uv sync --verbose --all-groups --no-install-project

      - name: Run tests and measure code coverage
        run: |
          PYTHONPATH="src" uv run python3 -m pytest \
                                             --code-highlight=yes \
                                             --color=yes \
                                             --verbosity=3 \
                                             -p pytest_cov \
                                             --cov=bridge \
                                             --cov-report=term-missing \
                                             --cov-report=xml \
                                             --cov-report=html

      - name: Upload code coverage report (coverage.xml)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage report to Codecov (best effort)
        continue-on-error: true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
